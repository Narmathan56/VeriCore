<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Vericore software architecture flowchart</title>
  <desc id="description">Comparison of Vericore's current script-driven prototype with a recommended modular-monolith architecture.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526179; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 13px; fill: #526179; }
      .tiny { font-size: 12px; fill: #526179; }
      .box { stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .edgeLabel { font-size: 12px; fill: #526179; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f5f7fb"/>
  <text x="800" y="52" text-anchor="middle" class="title">Vericore Software Architecture</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Current prototype and recommended modular-monolith flow</text>

  <rect x="50" y="105" width="1500" height="300" rx="18" fill="#ffffff" stroke="#d8e0ec" stroke-width="1.5"/>
  <text x="82" y="145" class="section">Current prototype</text>
  <text x="82" y="169" class="small">Script-driven; model responses are generated and scored offline.</text>

  <rect x="85" y="220" width="190" height="92" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="180" y="253" text-anchor="middle" class="label">Benchmark cases</text>
  <text x="180" y="278" text-anchor="middle" class="small">JSON datasets</text>

  <rect x="330" y="220" width="205" height="92" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="432" y="251" text-anchor="middle" class="label">Benchmark generator</text>
  <text x="432" y="277" text-anchor="middle" class="small">builds prompt / saves run</text>

  <rect x="590" y="220" width="200" height="92" class="box" fill="#fff7ed" stroke="#fdba74"/>
  <text x="690" y="251" text-anchor="middle" class="label">Groq tutor service</text>
  <text x="690" y="277" text-anchor="middle" class="small">stream_tutor(prompt)</text>

  <rect x="845" y="220" width="190" height="92" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="940" y="251" text-anchor="middle" class="label">Raw responses</text>
  <text x="940" y="277" text-anchor="middle" class="small">JSONL files</text>

  <rect x="1090" y="220" width="190" height="92" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1185" y="251" text-anchor="middle" class="label">Scorer scripts</text>
  <text x="1185" y="277" text-anchor="middle" class="small">compare / report metrics</text>

  <rect x="1335" y="205" width="180" height="122" class="box" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1425" y="240" text-anchor="middle" class="label">Math engine</text>
  <text x="1425" y="264" text-anchor="middle" class="small">normalize, solve,</text>
  <text x="1425" y="284" text-anchor="middle" class="small">validate (SymPy)</text>

  <path d="M275 266 H323" class="edge"/>
  <path d="M535 266 H583" class="edge"/>
  <path d="M790 266 H838" class="edge"/>
  <path d="M1035 266 H1083" class="edge"/>
  <path d="M1280 266 H1328" class="edge"/>
  <text x="800" y="354" text-anchor="middle" class="tiny">Separate smoke-test script also calls Groq directly; no web app, session store, or deployed request path is present.</text>

  <rect x="50" y="430" width="1500" height="640" rx="18" fill="#ffffff" stroke="#d8e0ec" stroke-width="1.5"/>
  <text x="82" y="472" class="section">Recommended target: modular monolith</text>
  <text x="82" y="497" class="small">Keep the math core deterministic and provider-independent; route every client through one tested application use case.</text>

  <rect x="90" y="590" width="230" height="190" class="box" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="205" y="622" text-anchor="middle" class="label">Client adapters</text>
  <text x="205" y="655" text-anchor="middle" class="small">CLI</text>
  <text x="205" y="682" text-anchor="middle" class="small">Benchmark runner</text>
  <text x="205" y="709" text-anchor="middle" class="small">Future HTTP / UI</text>
  <text x="205" y="750" text-anchor="middle" class="tiny">No business logic here</text>

  <rect x="410" y="555" width="470" height="290" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.7"/>
  <text x="645" y="590" text-anchor="middle" class="label">Application: Solve-question use case</text>
  <rect x="445" y="620" width="400" height="48" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="645" y="650" text-anchor="middle" class="small">1. Validate input, normalize, classify</text>
  <rect x="445" y="687" width="400" height="48" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="645" y="717" text-anchor="middle" class="small">2. Get trusted answer + tutor explanation</text>
  <rect x="445" y="754" width="400" height="48" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="645" y="784" text-anchor="middle" class="small">3. Validate answer and checkable steps</text>

  <rect x="1015" y="555" width="450" height="135" rx="15" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1240" y="587" text-anchor="middle" class="label">Math solver port → SymPy adapter</text>
  <text x="1240" y="618" text-anchor="middle" class="small">Expression parsing, exact solving, trusted answer</text>
  <text x="1240" y="650" text-anchor="middle" class="tiny">No Groq dependency</text>

  <rect x="1015" y="725" width="450" height="135" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1240" y="757" text-anchor="middle" class="label">Tutor provider port → Groq adapter</text>
  <text x="1240" y="788" text-anchor="middle" class="small">Prompting, structured response, streaming, timeouts</text>
  <text x="1240" y="820" text-anchor="middle" class="tiny">API key comes from environment configuration</text>

  <rect x="410" y="900" width="470" height="105" rx="15" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="645" y="934" text-anchor="middle" class="label">Domain contracts</text>
  <text x="645" y="963" text-anchor="middle" class="small">Question · AnswerSet · Solution · ValidationResult · errors</text>
  <text x="645" y="986" text-anchor="middle" class="tiny">Shared types and consistent numeric comparison policy</text>

  <rect x="1100" y="925" width="300" height="74" class="box" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1250" y="955" text-anchor="middle" class="label">One stable result</text>
  <text x="1250" y="980" text-anchor="middle" class="small">answer + explanation + validation</text>

  <path d="M320 685 H402" class="edgeBlue"/>
  <text x="360" y="672" text-anchor="middle" class="edgeLabel">question</text>
  <path d="M880 670 H1007" class="edge"/>
  <text x="943" y="656" text-anchor="middle" class="edgeLabel">solve</text>
  <path d="M1007 642 H890" class="edge"/>
  <text x="948" y="631" text-anchor="middle" class="edgeLabel">trusted answer</text>
  <path d="M880 755 H1007" class="edge"/>
  <text x="945" y="742" text-anchor="middle" class="edgeLabel">tutor request</text>
  <path d="M1007 812 H890" class="edge"/>
  <text x="948" y="833" text-anchor="middle" class="edgeLabel">structured explanation</text>
  <path d="M645 845 V892" class="edge"/>
  <path d="M880 952 H1092" class="edgeBlue"/>
  <text x="984" y="939" text-anchor="middle" class="edgeLabel">validated result</text>
  <path d="M1100 972 H350 V825 H260 V790" class="edge"/>
  <text x="470" y="843" text-anchor="middle" class="edgeLabel">return to client</text>

  <text x="800" y="1100" text-anchor="middle" class="tiny">Start with the existing CLI and benchmarks; add an API or persistence only when product needs require them.</text>
</svg>
